commit-msg:
  commands:
    commitlint:
      run: npm run commitlint -- --edit {1}

pre-commit:
  parallel: true
  commands:
    oxfmt:
      run: npm run fmt:check
    oxlint:
      run: npm run lint
    textlint:
      glob: "**/*.md"
      run: npm run textlint:files -- {staged_files}
    markdownlint:
      glob: "**/*.md"
      run: npm run markdownlint:files -- {staged_files}
