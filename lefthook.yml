commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    oxfmt:
      run: pnpm exec oxfmt --check
    oxlint:
      run: pnpm exec oxlint --deny-warnings
    textlint:
      glob: "{ideas,drafts,articles}/**.md"
      run: pnpm exec textlint {staged_files}
