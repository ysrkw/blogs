commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    oxfmt:
      run: pnpm exec oxfmt --check
    oxlint:
      run: pnpm lint
    textlint:
      glob: "**/*.md"
      run: pnpm exec textlint {staged_files}
    markdownlint:
      glob: "**/*.md"
      run: pnpm exec markdownlint-cli2 {staged_files}
